[project]
name = "mlops"
version = "0.1.0"
description = "Add your description here"
requires-python = "==3.12.*"
dependencies = [
    "certifi>=2025.10.5",
    "datasets>=4.4.0",
    "evaluate>=0.4.6",
    "lightning>=2.5.5",
    "pydantic>=2.12.3",
    "scikit-learn>=1.7.2",
    "scipy>=1.16.3",
    "transformers>=4.57.1",
    "wandb>=0.22.3",
]

[project.optional-dependencies]
cpu = [
    "torch>=2.9.0",
]
cu129 = [
    "torch>=2.9.0",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu129" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu129", extra = "cu129" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[dependency-groups]
dev = [
    "ipywidgets>=8.1.7",
    "notebook>=7.4.7",
]
